nam      # 4. تثبيت المكتبات من داخل المجلد الفرعي
      - name: Install Dependencies
        working-directory: ./your_folder_name
        run: flutter pub get

      # 5. بناء ملف الـ APK من داخل المجلد الفرعي
      - name: Build APK
        working-directory: ./your_folder_name
        run: flutter build apk --release
              - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: your_folder_name/build/app/outputs/flutter-apk/app-release.apk
          
