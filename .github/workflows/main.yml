name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تثبيت JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. تفعيل التخزين المؤقت لملفات Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 4. توليد ملفات Gradle Wrapper تلقائيًا لأنها غير موجودة في المستودع
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating it..."
            gradle wrapper --gradle-version 8.7
          fi

      # 5. منح صلاحية التنفيذ لملف gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 6. بناء ملف الـ APK بصيغة release
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 7. رفع ملف الـ APK الناتج كمخرج (Artifact)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
